name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Droits minimaux : la CI ne fait que lire le dépôt.
permissions:
  contents: read

# Un nouveau push annule l'exécution en cours de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les actions sont épinglées par leur identifiant de commit (protection contre une
# action compromise) ; Dependabot propose les mises à jour chaque semaine.

jobs:
  python:
    name: Python (syntaxe + lint)
    # ubuntu suffit : py_compile/ruff sont de simples vérifications statiques,
    # rien ici n'a besoin des API Windows utilisées par l'app elle-même.
    # Version épinglée pour ne pas subir le changement de « ubuntu-latest ».
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Vérification de syntaxe pure : aucune dépendance du projet n'est
      # nécessaire (mêmes garanties que le hook pre-commit local), donc
      # rapide et sans installer le venv complet (~1.6 Go).
      # tools/sandbox, tools/tests et tools/training sont des scripts
      # utilitaires annexes (fixtures manuelles, notebooks d'entraînement),
      # pas du code livré avec l'application — mêmes exclusions que ruff.
      - name: Compilation (py_compile)
        shell: bash
        run: |
          git ls-files '*.py' \
            | grep -v '^tools/sandbox/' | grep -v '^tools/tests/' | grep -v '^tools/training/' \
            | xargs python -m py_compile

      # Bloquant : le code passe aujourd'hui toutes les règles de pyproject.toml
      # (noms inconnus, imports et variables inutilisés, redéfinitions).
      # Version de ruff fixée : une mise à jour de l'outil ne casse pas la CI toute seule.
      - name: Lint (ruff)
        run: |
          python -m pip install --quiet ruff==0.16.6
          ruff check .

  frontend:
    name: Frontend (types + lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interfaces/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: interfaces/frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types (tsc)
        run: npx tsc --noEmit

      # Bloquant sur les erreurs ET les avertissements (le code est propre).
      - name: Lint (eslint)
        run: npm run lint -- --max-warnings 0

      - name: Construction de l'interface (vite build)
        run: npm run build

      # Informatif : les alertes de sécurité npm ne bloquent pas un push.
      - name: Audit des dépendances (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

  depot:
    name: Dépôt (fichiers interdits)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Échoue si un fichier privé, une clé ou un gros binaire entre dans Git.
      - name: Fichiers qui ne doivent jamais être suivis
        shell: bash
        run: |
          interdits=$(git ls-files | grep -E '(^|/)\.env$|(^|/)credentials\.json$|(^|/)token[_.].*\.json$|\.pickle$|\.pem$|\.key$|(^|/)adb_key|(^|/)jarvis_audit\.log$|^docs/AUDIT_BUGS\.md$|(^|/)\.jarvis_cache_version$|(^|/)voiceprints/|(^|/)chroma_db/|(^|/)memory\.json$|(^|/)jarvis_(memoire|conversations|synapses|listes|config)\.json$' || true)
          if [ -n "$interdits" ]; then
            echo "Fichiers privés suivis par Git :"; echo "$interdits"; exit 1
          fi

      - name: Fichiers trop lourds (> 20 Mo)
        shell: bash
        run: |
          lourds=$(git ls-files -z | xargs -0 ls -l | awk '$5 > 20000000 {print $5, $9}')
          if [ -n "$lourds" ]; then
            echo "Fichiers de plus de 20 Mo :"; echo "$lourds"; exit 1
          fi

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Bloquant : l'historique a été vérifié, aucun secret n'y est détecté.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances:
    name: Dépendances Python (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Informatif : des paquets ont des failles connues ; les mettre à jour demande
    # des essais un par un (voir CLAUDE.md), donc l'échec ne bloque pas la CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # requirements.txt est en UTF-16 : on le convertit avant de l'auditer.
      - name: Audit (pip-audit)
        shell: bash
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          iconv -f UTF-16 -t UTF-8 requirements.txt | tr -d '\r' > /tmp/requirements-utf8.txt
          pip-audit -r /tmp/requirements-utf8.txt --no-deps --disable-pip
