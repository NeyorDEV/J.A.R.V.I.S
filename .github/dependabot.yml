# Mises à jour automatiques proposées chaque semaine sous forme de pull requests.
# (Les dépendances Python ne sont pas listées : requirements.txt est en UTF-16,
# format que Dependabot ne sait pas lire.)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/interfaces/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
